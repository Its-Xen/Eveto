# docker-compose.yml
services:
  # ----------------------------------------
  # PostgreSQL Database
  # ----------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: eveto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP_DB__USER}
      POSTGRES_PASSWORD: ${APP_DB__PASSWORD}
      POSTGRES_DB: ${APP_DB__NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB__USER} -d ${APP_DB__NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # Redis (Cache & Broker)
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: eveto-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ----------------------------------------
  # FastAPI Application
  # ----------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: eveto-api
    restart: unless-stopped
    env_file:
      - .env # Reads .env file automatically
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Mount local code for hot-reloading during development
    volumes:
      - .:/app
    # --timeout-graceful-shutdown 30 to the command!
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --timeout-graceful-shutdown 30
    # Docker waits 30s before SIGKILL!
    stop_grace_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ----------------------------------------
  # Observability Stack
  # ----------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: eveto-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: 
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
    depends_on:
      - tempo
  
  tempo:
    image: grafana/tempo:latest
    container_name: eveto-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200" # Tempo UI

  loki:
    image: grafana/loki:latest
    container_name: eveto-loki
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    ports: 
      - "3100:3100" # Loki API
    volumes:
      - loki_data:/loki

  prometheus:
    image: prom/prometheus:latest
    container_name: eveto-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  vector:
    image: timberio/vector:latest-debian
    container_name: eveto-vector
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki


  grafana:
    image: grafana/grafana:latest
    container_name: eveto-grafana
    ports: 
      - "3000:3000"
    environment:
    - GF_AUTH_ANONYMOUS_ENABLED=true
    - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
    - loki
    - tempo
    - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

# ----------------------------------------
# Named Volumes for Data Persistence
# ----------------------------------------
volumes:
  postgres_data:
  redis_data:
  grafana_data:
  loki_data:
  tempo_data:
  prometheus_data: