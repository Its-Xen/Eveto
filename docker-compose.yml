# docker-compose.yml
services:
  # ----------------------------------------
  # PostgreSQL Database
  # ----------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: eveto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP_DB__USER}
      POSTGRES_PASSWORD: ${APP_DB__PASSWORD}
      POSTGRES_DB: ${APP_DB__NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB__USER} -d ${APP_DB__NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # Redis (Cache & Broker)
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: eveto-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ----------------------------------------
  # FastAPI Application
  # ----------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: eveto-api
    restart: unless-stopped
    env_file:
      - .env  # Reads your .env file automatically
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Mount local code for hot-reloading during development
    volumes:
      - .:/app
    # Override command to enable hot-reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

# ----------------------------------------
# Named Volumes for Data Persistence
# ----------------------------------------
volumes:
  postgres_data:
  redis_data: